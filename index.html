                "start_url": "./",
                "background_color": "#F9F9F6",
                "theme_color": "#4A7C59",
                "display": "standalone",
                "orientation": "portrait"
            };
            const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
            document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

            if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => self.clients.claim());
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            fetch(e.request).catch(() => caches.match(e.request))
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(swBlob);

                window.addEventListener('load', () => {
                    navigator.serviceWorker.register(swUrl)
                        .catch(err => console.log('Service Worker の登録スキップ:', err));
                });
            }
        } catch(e) {
            console.warn('PWA初期化スキップ:', e);

    window.onload = function() {
        const savedApi = localStorage.getItem('recipe_api_id');
        if (savedApi) document.getElementById('api-id').value = savedApi;

        const savedMenu = localStorage.getItem('weekly_menu_data');
        if (savedMenu) {
            try {
                currentWeeklyMenu = JSON.parse(savedMenu);
            } catch (e) {
                currentWeeklyMenu = [];
            }
        }

        checkSaturdayAutoRefresh();
    };

    function saveApiId() {
        localStorage.setItem('recipe_api_id', document.getElementById('api-id').value.trim());
    }

    function checkSaturdayAutoRefresh() {
        const today = new Date();
        const isSaturday = (today.getDay() === 6);
        const todayStr = today.toISOString().split('T')[0];
        const lastUpdate = localStorage.getItem('last_saturday_update');

        if (isSaturday && lastUpdate !== todayStr) {
            document.getElementById('sat-notice').style.display = 'block';
            localStorage.setItem('last_saturday_update', todayStr);
            generateBalancedMenu(false);
        } else if (!currentWeeklyMenu || currentWeeklyMenu.length === 0) {
            generateBalancedMenu(false);
        } else {
            updateAll();
        }
    }

    async function fetchRakutenRecipe(category) {
        const appId = document.getElementById('api-id').value.trim();
        if (!appId) return null;

        const categoryId = rakutenCategoryIds[category] || "10";
        const url = `https://app.rakuten.co.jp/services/api/Recipe/CategoryRanking/V20170426?applicationId=${appId}&categoryId=${categoryId}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('API取得失敗');
            const data = await response.json();
            
            if (data.result && data.result.length > 0) {
                const item = data.result[Math.floor(Math.random() * data.result.length)];
                
                const parsedIngredients = item.recipeMaterial.map(matStr => {
                    return {
                        name: matStr,
                        amount: 1,
                        unit: "人前分",
                        pricePerUnit: 120
                    };
                });

                return {
                    name: item.recipeTitle,
                    category: category,
                    tags: ["楽天人気レシピ", item.recipeCost || "簡単"],
                    ingredients: parsedIngredients.slice(0, 3),
                    steps: [item.recipeDescription || "詳細はレシピリンクを参照してください。下処理をして火が通るまで丁寧に加熱します。"],
                    imageUrl: item.foodImageUrl,
                    url: item.recipeUrl
                };
            }
        } catch (err) {
            console.warn("楽天APIからの取得をスキップしローカルデータを使用します:", err);
        }
        return null;
    }

    async function generateSingleRandomRecipe() {
        const categories = ["Pork", "Fish", "Chicken", "Soy"];
        const randomCategory = categories[Math.floor(Math.random() * categories.length)];
        
        let mainRecipe = await fetchRakutenRecipe(randomCategory);

        if (!mainRecipe) {
            const filteredMains = mainsLocal.filter(m => m.category === randomCategory);
            const pool = filteredMains.length > 0 ? filteredMains : mainsLocal;
            mainRecipe = pool[Math.floor(Math.random() * pool.length)];
        }

        const randomSide = sides[Math.floor(Math.random() * sides.length)];

        return {
            name: mainRecipe.name,
            sub: randomSide.sub,
            category: mainRecipe.category,
            tags: Array.from(new Set([...mainRecipe.tags, randomSide.tag])),
            ingredients: [...mainRecipe.ingredients, ...randomSide.ingredients],
            steps: [...mainRecipe.steps, randomSide.step],
            imageUrl: mainRecipe.imageUrl || null,
            url: mainRecipe.url || null
        };
    }

    async function generateBalancedMenu(isManual = false) {
        const btn = document.getElementById('shuffle-all-btn');
        btn.disabled = true;
        btn.innerText = '🔄 取得中...';

        currentWeeklyMenu = [];
        for (let i = 0; i < 7; i++) {
            const recipe = await generateSingleRandomRecipe();
            currentWeeklyMenu.push(recipe);
        }
        
        localStorage.setItem('weekly_menu_data', JSON.stringify(currentWeeklyMenu));
        updateAll();

        btn.disabled = false;
        btn.innerText = '今すぐ手動で全更新';

        if (isManual) {
            alert('献立と買い物リストを新しく再生成しました！');
        }
    }

    async function updateRecipe(dayIndex, btnElement) {
        if (btnElement) {
            btnElement.disabled = true;
            btnElement.innerText = '🔄 更新中...';
        }

        currentWeeklyMenu[dayIndex] = await generateSingleRandomRecipe();
        localStorage.setItem('weekly_menu_data', JSON.stringify(currentWeeklyMenu));
        updateAll();
    }

    function updateAll() {
        const persons = parseInt(document.getElementById('person-count').value, 10) || 1;
        renderMenu(persons);
        renderShoppingList(persons);
        updateNutritionSummary();
    }

    function renderMenu(persons) {
        const menuGrid = document.getElementById('menu-grid');
        menuGrid.innerHTML = '';

        currentWeeklyMenu.forEach((recipe, index) => {
            const card = document.createElement('div');
            card.className = 'menu-card';

            let ingredientsHTML = '';
            let recipeTotalPrice = 0;

            recipe.ingredients.forEach(ing => {
                const totalAmount = Math.round((ing.amount * persons) * 10) / 10;
                const ingredientPrice = Math.round(totalAmount * ing.pricePerUnit);
                recipeTotalPrice += ingredientPrice;

                ingredientsHTML += `<li>${ing.name}: ${totalAmount} ${ing.unit}</li>`;
            });

            let stepsHTML = recipe.steps.map(step => `<li>${step}</li>`).join('');
            let tagsHTML = recipe.tags.map(t => `<span class="badge">${t}</span>`).join(' ');
            let imageHTML = recipe.imageUrl ? `<img src="${recipe.imageUrl}" alt="${recipe.name}" class="dish-image">` : '';
            let linkHTML = recipe.url ? `<a href="${recipe.url}" target="_blank" rel="noopener" class="recipe-link">📖 楽天レシピで詳細を見る</a>` : '';

            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <span class="day-title">${days[index]}</span>
                        <button class="unified-change-btn" onclick="updateRecipe(${index}, this)">🔄 単体更新</button>
                    </div>
                    ${imageHTML}
                    <div class="dish-title">${recipe.name}</div>
                    <div class="side-dish">${recipe.sub}</div>
                    ${linkHTML}
                    <div class="menu-price">目安食費: 約 ${recipeTotalPrice.toLocaleString()} 円 (${persons}人分)</div>
                    <div class="badge-list">${tagsHTML}</div>
                    <div class="recipe-section-title">材料 (${persons}人分)</div>
                    <ul class="recipe-list">${ingredientsHTML}</ul>
                    <div class="recipe-section-title">詳しい作り方・手順</div>
                    <ol class="recipe-list">${stepsHTML}</ol>
                </div>
            `;
            menuGrid.appendChild(card);
        });
    }

    function renderShoppingList(persons) {
        const shoppingListContainer = document.getElementById('shopping-list');
        // ボタン要素を保持するため、ボタン以外を更新
        const existingButton = shoppingListContainer.querySelector('button') || document.createElement('button');
        // もしボタンがDOMにない場合の考慮を含め、全体を再構築するかボタンを退避
    }

    // 再描画の処理を綺麗に分離
    function renderShoppingList(persons) {
        const shoppingListContainer = document.getElementById('shopping-list');
        shoppingListContainer.innerHTML = '';

        const totals = {};
        let grandTotal = 0;

        currentWeeklyMenu.forEach(recipe => {
            recipe.ingredients.forEach(ing => {
                const key = `${ing.name}_${ing.unit}`;
                const amount = ing.amount * persons;
                const price = amount * ing.pricePerUnit;

                if (totals[key]) {
                    totals[key].amount += amount;
                    totals[key].price += price;
                } else {
                    totals[key] = {
                        name: ing.name,
                        amount: amount,
                        unit: ing.unit,
                        price: price,
                        category: categoryMapping[ing.name] || "🥚 豆腐・卵・加工品・その他"
                    };
                }
            });
        });

        const categorized = {};
        Object.values(totals).forEach(item => {
            const cat = item.category;
            if (!categorized[cat]) categorized[cat] = [];
            categorized[cat].push(item);
        });

        let itemIndex = 0;
        const categoryOrder = ["🥩 肉類", "🐟 魚介類", "🥬 野菜・キノコ類", "🥚 豆腐・卵・加工品・その他"];

        categoryOrder.forEach(categoryName => {
            if (categorized[categoryName] && categorized[categoryName].length > 0) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'category-group';

                let groupHTML = `<div class="category-header">${categoryName}</div>`;

                categorized[categoryName].forEach(item => {
                    const roundedPrice = Math.round(item.price);
                    const roundedAmount = Math.round(item.amount * 10) / 10;
                    grandTotal += roundedPrice;

                    groupHTML += `
                        <div class="shopping-item">
                            <div>
                                <input type="checkbox" id="item-${itemIndex}" onchange="toggleCheck(this)">
                                <label for="item-${itemIndex}">${item.name} ： <strong>${roundedAmount} ${item.unit}</strong></label>
                            </div>
                            <div style="color:#666; font-size:0.875rem;">約 ${roundedPrice.toLocaleString()} 円</div>
                        </div>
                    `;
                    itemIndex++;
                });

                groupDiv.innerHTML = groupHTML;
                shoppingListContainer.appendChild(groupDiv);
            }
        });

        document.getElementById('grand-total').innerText = `￥${grandTotal.toLocaleString()}`;
    }

    function updateNutritionSummary() {
        const summaryContainer = document.getElementById('nutrition-summary');
        const fishCount = currentWeeklyMenu.filter(r => r.category === "Fish").length;
        const soyCount = currentWeeklyMenu.filter(r => r.category === "Soy").length;

        summaryContainer.innerHTML = `
            <span class="nutri-tag">✅ 野菜・食物繊維たっぷり</span>
            <span class="nutri-tag">✅ お魚メニュー (${fishCount}回/週)</span>
            <span class="nutri-tag">✅ 大豆・豆腐類 (${soyCount}回/週)</span>
            <span class="nutri-tag">✅ 主菜・副菜のバランス○</span>
        `;
    }

    function toggleCheck(checkbox) {
        const item = checkbox.closest('.shopping-item');
        if (checkbox.checked) {
            item.classList.add('checked');
        } else {
            item.classList.remove('checked');
        }
    }

    function switchTab(tabName) {
        document.getElementById('tab-menu').classList.toggle('active', tabName === 'menu');
        document.getElementById('tab-shopping').classList.toggle('active', tabName === 'shopping');

        document.getElementById('menu-section').classList.toggle('active', tabName === 'menu');
        document.getElementById('shopping-section').classList.toggle('active', tabName === 'shopping');
    }

    // 買い物リストをクリップボードにコピーする関数
    function copyShoppingList() {
        const persons = parseInt(document.getElementById('person-count').value, 10) || 1;
        const totals = {};
        let grandTotal = 0;

        currentWeeklyMenu.forEach(recipe => {
            recipe.ingredients.forEach(ing => {
                const key = `${ing.name}_${ing.unit}`;
                const amount = ing.amount * persons;
                const price = amount * ing.pricePerUnit;

                if (totals[key]) {
                    totals[key].amount += amount;
                    totals[key].price += price;
                } else {
                    totals[key] = {
                        name: ing.name,
                        amount: amount,
                        unit: ing.unit,
                        price: price,
                        category: categoryMapping[ing.name] || "🥚 豆腐・卵・加工品・その他"
                    };
                }
            });
        });

        const categorized = {};
        Object.values(totals).forEach(item => {
            const cat = item.category;
            if (!categorized[cat]) categorized[cat] = [];
            categorized[cat].push(item);
        });

        let textToCopy = `🛒 【1週間分の買い物リスト】 (${persons}人分)\n`;
        const categoryOrder = ["🥩 肉類", "🐟 魚介類", "🥬 野菜・キノコ類", "🥚 豆腐・卵・加工品・その他"];

        categoryOrder.forEach(categoryName => {
            if (categorized[categoryName] && categorized[categoryName].length > 0) {
                textToCopy += `\n[${categoryName}]\n`;
                categorized[categoryName].forEach(item => {
                    const roundedAmount = Math.round(item.amount * 10) / 10;
                    const roundedPrice = Math.round(item.price);
                    textToCopy += `・${item.name}：${roundedAmount}${item.unit} (約${roundedPrice}円)\n`;
                    grandTotal += roundedPrice;
                });
            }
        });

        textToCopy += `\n💰 合計目安金額: 約 ${grandTotal.toLocaleString()} 円`;

        navigator.clipboard.writeText(textToCopy).then(() => {
            alert('買い物リストをクリップボードにコピーしました！LINEなどに貼り付けて共有できます。');
        }).catch(err => {
            console.error('コピーに失敗しました:', err);
            alert('コピーに失敗しました。お使いのブラウザ環境をご確認ください。');
        });
    }
</script>
